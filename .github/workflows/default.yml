name: Default

on:
  push:
    branches:
      - master
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: "Branch/ref to build (defaults to the triggering ref)"
        required: false
        type: string

jobs:
  clean:
    name: Clean
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false # avoid cache thrashing
        id: go

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-clean-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-clean-
            ${{ runner.os }}-go-

      - name: Install tools
        run: make install

      - name: Assets
        run: make assets

      - name: Docs
        run: make docs

      - name: Porcelain
        run: make porcelain

  build:
    name: Build
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
        id: go

      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-
            ${{ runner.os }}-go-

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - run: mkdir dist && touch dist/empty

      - name: Build
        run: make build

  test:
    name: Test
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
        id: go

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-test-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-test-
            ${{ runner.os }}-go-

      - name: Test
        run: mkdir dist && touch dist/empty && make test

  lint:
    name: Lint
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false # avoid cache thrashing
        id: go

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-lint-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-lint-
            ${{ runner.os }}-go-

      - run: mkdir dist && touch dist/empty

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout 5m

      - name: License
        run: make license

  ui:
    name: UI
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: "26"
          cache: true

      - name: Install
        run: make install-ui

      - name: OpenAPI
        run: if grep -q '^openapi' Makefile; then make openapi; fi

      - name: Lint
        run: make lint-ui

      - name: Test
        run: make test-ui

      - name: License
        run: make license-ui

      - name: Build UI
        run: make ui

      - name: Cache dist
        # ponytail: previously push/pull_request-only to avoid nightly thrashing,
        # but nightly now builds feature/cheap which push/PR never touches, so
        # nightly must populate its own cache -- save unconditionally.
        # Keyed by run_id (not github.sha): nightly's ref input (feature/cheap)
        # can carry new commits while github.sha (master, the trigger) stays
        # unchanged, so a sha-keyed cache would go stale and never update.
        uses: actions/cache/save@v5
        id: cache-dist
        with:
          path: dist
          key: ${{ runner.os }}-${{ github.run_id }}-dist

      - name: Porcelain
        run: |
          test -z "$(git status --porcelain)" || (git status; git diff; false)

  integration-shard:
    name: Integration ${{ matrix.shard }}/2
    runs-on: depot-ubuntu-24.04-arm-32

    permissions:
      contents: read
      actions: write

    # the Playwright run is the longest step of the workflow, so it is split
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # setup-go keys its cache on ImageOS. Fork runs must look up the key the
      # GitHub-hosted runner produces, else they miss the warmed entry
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        env:
          ImageOS: ${{ github.event.pull_request.head.repo.fork && 'ubuntu24-arm64' || 'ubuntu24' }}
        with:
          go-version-file: go.mod
        id: go

      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: ".node-version"
          cache: true

      - name: Install
        run: make install-ui

      - name: Restore vp task cache
        # restore only, the UI job owns saving the cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ runner.os }}-${{ runner.arch }}-vp-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-vp-

      - name: Build UI
        run: make ui

      - name: Build Go
        run: make build

      - name: Get Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> $GITHUB_ENV

      - name: Cache Playwright browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright (browsers + deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: vpx playwright install --with-deps chromium
        timeout-minutes: 5

      - name: Save Playwright browsers
        # one writer, the shards would race for the same key
        if: github.ref == 'refs/heads/master' && steps.playwright-cache.outputs.cache-hit != 'true' && matrix.shard == 1
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      - name: Run tests
        run: vpx playwright test --shard=${{ matrix.shard }}/2
        timeout-minutes: 20
        env:
          TZ: Europe/Berlin

      - name: Upload Playwright Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright Raw Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 2

  # branch protection requires one check named Integration
  integration:
    name: Integration
    needs: integration-shard
    if: always()
    runs-on: depot-ubuntu-24.04-arm

    permissions:
      contents: read

    steps:
      - run: test "${{ needs.integration-shard.result }}" = success

  # fork pull requests run on GitHub-hosted runners with the GitHub cache, which
  # only master can seed for them. Must not run on a Depot runner, those write
  # to Depot's cache instead
  warm-fork-cache-go:
    name: Warm fork cache (Go)
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
        id: go

      # on a hit setup-go does not save again, so building would populate nothing
      - name: Build
        if: steps.go.outputs.cache-hit != 'true'
        run: mkdir dist && touch dist/empty && make build

  warm-fork-cache-ui:
    name: Warm fork cache (UI)
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: ".node-version"
          cache: true

      - name: Get Playwright version
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> $GITHUB_ENV

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install
        run: make install-ui

      - name: Install Playwright (browsers + deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: vpx playwright install --with-deps chromium
        timeout-minutes: 5

      # the UI job saves its task cache on a Depot runner, so forks never see
      # it. Run the same tasks here to seed the GitHub-hosted cache
      - name: Restore vp task cache
        id: vp-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ runner.os }}-${{ runner.arch }}-vp-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-vp-

      - name: Warm vp tasks
        run: make openapi lint-ui test-ui ui

      - name: Save vp task cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vp-cache.outputs.cache-primary-key }}
