name: Nightly Build
permissions:
  contents: read

on:
  schedule: # runs on the default branch: master
    - cron: "0 2 * * *" # run at 2 AM UTC
  workflow_dispatch:

jobs:
  check_date:
    runs-on: ubuntu-24.04
    name: Check latest commit

    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.should_run.outputs.should_run }}
    steps:
      # ponytail: nightly is built from feature/cheap (synced daily from upstream),
      # not master -- master only carries this repo's CI workflow files.
      - uses: actions/checkout@v6
        with:
          ref: refs/heads/feature/cheap
          persist-credentials: false
      - name: print latest_commit
        run: echo $(git rev-parse HEAD)

      - id: should_run
        continue-on-error: true
        name: check latest commit is less than a day
        if: ${{ github.event_name == 'schedule' }}
        run: test -z $(git rev-list  --after="24 hours" HEAD) && echo "should_run=false" >> $GITHUB_OUTPUT

  call-build-workflow:
    name: Call Build
    needs: check_date
    if: |
      needs.check_date.outputs.should_run != 'false'
      && startsWith(github.ref, 'refs/heads/master')
      && ! contains(github.head_ref, 'refs/heads/chore/')
    uses: ./.github/workflows/default.yml
    with:
      ref: refs/heads/feature/cheap
    permissions:
      contents: read
      actions: write

  docker:
    name: Publish Docker :nightly
    needs:
      - call-build-workflow
    # ponytail: skip on forks without Docker Hub secrets configured (e.g. GHCR-only forks)
    if: ${{ secrets.DOCKER_USER != '' && secrets.DOCKER_PASS != '' }}
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/heads/feature/cheap # force cheap branch (synced fork)
          fetch-depth: 0
          persist-credentials: false

      - name: Get dist from cache
        uses: actions/cache/restore@v5
        id: cache-dist
        with:
          path: dist
          key: ${{ runner.os }}-${{ github.sha }}-dist

      - name: Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Define tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: evcc/evcc
          tags: |
            type=raw,value=nightly
            type=raw,value=nightly.{{date 'YYYYMMDD'}}-{{sha}}

      - name: Publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v6
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Delete old nightly.* tags
        run: |
          old_tags=$(curl -s "https://hub.docker.com/v2/repositories/evcc/evcc/tags/?page_size=100" | jq -r '.results | map(select(.name | startswith("nightly."))) | sort_by(.last_updated) | reverse | .[1:] | .[].name')
          for tag in $old_tags; do
            echo "Deleting tag: $tag"
            curl -s -H "Authorization: Bearer ${{ secrets.DOCKER_PASS }}" -X DELETE "https://hub.docker.com/v2/repositories/evcc/evcc/tags/$tag/"
          done

  hassio:
    name: Hassio Addon :nightly
    needs:
      - docker
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: evcc-io/hassio-addon
          token: ${{ secrets.HASSIO_DEPLOY_TOKEN }}
          path: ./hassio

      - name: Update version
        run: |
          current_date=$(date +%Y%m%d)
          short_sha=$(echo "${{ github.sha }}" | cut -c 1-7)
          sed -i -e "s/version:.*/version: nightly.${current_date}-${short_sha}/" ./hassio/evcc-nightly/config.yaml

      - name: Push
        run: |
          cd ./hassio
          git add .
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -am "Mirror evcc nightly release"
          git push

  apt:
    name: Publish nightly .deb as release asset
    needs:
      - call-build-workflow
    runs-on: ubuntu-24.04

    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/heads/feature/cheap
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
        id: go

      - name: Patch ASN1
        run: make patch-asn1-sudo

      - name: Get dist from cache
        uses: actions/cache/restore@v5
        id: cache-dist
        with:
          path: dist
          key: ${{ runner.os }}-${{ github.sha }}-dist

      - name: Create nightly build
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: --snapshot -f .goreleaser-nightly.yml --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ponytail: rolling "nightly" release, old tag+assets are dropped and recreated daily
      - name: Publish .deb as GitHub release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha=$(git rev-parse HEAD)
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly release/*.deb \
            --title "Nightly Build" \
            --notes "Automated nightly build from feature/cheap@${sha}" \
            --prerelease \
            --target "${sha}"
