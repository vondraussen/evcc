name: Nightly Build
permissions:
  contents: read

on:
  schedule: # runs on the default branch: master
    - cron: "0 2 * * *" # run at 2 AM UTC
  workflow_dispatch:

jobs:
  check_date:
    runs-on: ubuntu-latest
    name: Check latest commit

    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.should_run.outputs.should_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: print latest_commit
        run: echo ${{ github.sha }}

      - id: should_run
        continue-on-error: true
        name: check latest commit is less than a day
        if: ${{ github.event_name == 'schedule' }}
        run: test -z $(git rev-list  --after="24 hours" ${{ github.sha }}) && echo "should_run=false" >> $GITHUB_OUTPUT

  call-build-workflow:
    name: Call Build
    needs: check_date
    if: |
      ${{ needs.check_date.outputs.should_run != 'false' }}
      && startsWith(github.ref, 'refs/heads/feature/cheap')
      && ! contains(github.head_ref, 'refs/heads/chore/')
    uses: vondraussen/evcc/.github/workflows/default.yml@feature/cheap
    permissions:
      contents: read
      actions: write

  docker:
    needs:
      - call-build-workflow
    uses: ./.github/workflows/nightly-docker.yml
    permissions:
      contents: read
      actions: read
    secrets: inherit

  hassio:
    name: Hassio Addon :nightly
    needs:
      - docker
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: evcc-io/hassio-addon
          token: ${{ secrets.HASSIO_DEPLOY_TOKEN }}
          path: ./hassio

      - name: Update version
        run: |
          current_date=$(date +%Y%m%d)
          short_sha=$(echo "${{ github.sha }}" | cut -c 1-7)
          sed -i -e "s/version:.*/version: nightly.${current_date}-${short_sha}/" ./hassio/evcc-nightly/config.yaml

      - name: Push
        run: |
          cd ./hassio
          git add .
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -am "Mirror evcc nightly release"
          git push

  hassio-changelog:
    name: Update Hassio Nightly Changelog
    needs:
      - hassio
    uses: ./.github/workflows/hassio-changelog.yml
    with:
      addon_path: evcc-nightly
      include_unreleased: true
    secrets: inherit

  apt:
    name: Publish APT nightly
    needs:
      - call-build-workflow
    runs-on: ubuntu-24.04

    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
        id: go

      - name: Patch ASN1
        run: make patch-asn1-sudo

      # ponytail: previous run's "nightly" tag is fetched by checkout (fetch-depth:0) and
      # confuses goreleaser's version detection (non-semver "current tag") if not removed
      # before the build - must run before goreleaser, not after.
      - name: Remove stale nightly tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          git tag -d nightly 2>/dev/null || true

      - name: Get dist from cache
        uses: actions/cache/restore@v6
        id: cache-dist
        with:
          path: dist
          key: ${{ runner.os }}-${{ github.run_id }}-dist

      - name: Create nightly build
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: '~> v2'
          args: --snapshot -f .goreleaser-nightly.yml --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ponytail: this fork has no Cloudsmith secrets, so publish as a rolling
      # "nightly" GitHub release instead. Stale tag is already cleared above,
      # before the build, so no delete needed here.
      - name: Publish .deb as GitHub release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha=$(git rev-parse HEAD)
          gh release create nightly release/*.deb \
            --title "Nightly Build" \
            --notes "Automated nightly build from feature/cheap@${sha}" \
            --prerelease \
            --target "${sha}"
